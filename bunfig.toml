preload = ["@opentui/solid/preload"]

[install]
linker = "isolated"
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = [
  "@biomejs/biome",
  "@opentui/core",
  "@opentui/solid",
  "@pierre/diffs",
  "@turbo/darwin-arm64",
  "@turbo/linux-64",
  "@types/bun",
  "oxlint",
  "oxlint-tsgolint",
  "solid-js",
  "string-width",
  "turbo",
  "typescript",
]

[test]
preload = ["@opentui/solid/preload"]
coverage = false
