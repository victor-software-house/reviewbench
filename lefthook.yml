pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: "**/*.{ts,tsx,js,jsx,json,jsonc,md,yml,yaml,toml}"
      run: mise run format
    lint:
      run: mise run lint
    typecheck:
      run: mise run typecheck

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    commitlint:
      run: mise run commitlint -- {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile-sync:
      run: mise run --no-deps lockfile:sync
    verify:
      run: mise run verify
